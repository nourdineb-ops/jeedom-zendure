<!--
Template "Condensé" (addendum §14.3) : tuile compacte ~410px, anneau SOC,
4 flux clés en liste, barre d'intensité colorée fine, euros en pied.
Tokens ##XXX## remplacés côté PHP par zendure::toHtmlCondense()
(core/class/zendure.class.php). Une seule animation légère (anneau SOC),
respecte ##ANIMATIONS_CLASS##.

Le CSS est inline (<style> ci-dessous) plutôt que dans un fichier .css à
part : rien dans Jeedom ne charge automatiquement un CSS associé à un
template de dashboard custom (convention maison, pas native -- cf. README
"Points ouverts"), et ce toHtml() peut être injecté dans des contextes très
différents (dashboard normal, tuile "compact", app mobile...) qui ne
chargent pas forcément les mêmes assets. L'inline garantit que le style
voyage toujours avec le HTML, quel que soit l'endroit où Jeedom l'affiche
-- constaté en réel le 2026-07-22 : sans ça, le cercle SOC s'affiche comme
un disque plein noir (fill SVG par défaut) et les libellés/valeurs collent
sans espace (justify-content: space-between jamais appliqué).

Fond transparent (pas de background ici) : ce toHtml() personnalisé remplace
entièrement le rendu, mais Jeedom habille déjà chaque objet du dashboard
d'un conteneur avec son propre fond -- une couleur en dur ici double ce fond
au lieu de s'y fondre (signalé le 2026-07-22 : boîte visuellement détachée
du reste du dashboard, contrairement aux autres tuiles). Titre cliquable
(##EQ_LINK##, cf. eqLogic::getLinkToConfiguration()) : même comportement que
le rendu standard Jeedom (core/template/dashboard/eqLogic.html), qu'on
perd sinon en remplaçant tout le HTML.
-->
<style>
    .zendure-condense {
        width: 410px;
        max-width: 100%;
        border-radius: 10px;
        padding: 10px 14px;
        /* var(--txt-color, #333) : même variable/fallback que flux_widget.html et
           zf_gauge/zf_money (validés en réel le 2026-07-25) -- l'ancien
           var(--text-widget, #eee) référençait une variable CSS qui n'existe nulle
           part dans Jeedom (grep core/css/*.css : aucune occurrence), le fallback
           #eee (quasi blanc, pensé pour un fond sombre) s'appliquait donc toujours
           et rendait le texte illisible sur le thème clair par défaut (constaté par
           l'utilisateur le 2026-08-04, capture d'écran à l'appui). */
        color: var(--txt-color, #333);
        font-size: 13px;
        box-sizing: border-box;
    }

    .zendure-condense .zc-header {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        margin-bottom: 6px;
    }

    .zendure-condense .zc-name {
        color: inherit;
        text-decoration: none;
    }

    .zendure-condense .zc-name:hover {
        text-decoration: underline;
    }

    .zendure-condense .zc-body {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
    }

    .zendure-condense .zc-soc-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        flex: 0 0 auto;
    }

    .zendure-condense .zc-soc-ring {
        position: relative;
        width: 72px;
        height: 72px;
        flex: 0 0 auto;
    }

    .zendure-condense .zc-soc-label,
    .zendure-condense .zc-intensite-label {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        opacity: 0.65;
    }

    .zendure-condense .zc-soc-ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
    }

    .zendure-condense .zc-soc-bg {
        fill: none;
        /* Gris neutre semi-transparent (pas blanc) : lisible sur fond clair
           comme sombre, même correctif que le texte ci-dessus. */
        stroke: rgba(127, 127, 127, 0.25);
        stroke-width: 3;
    }

    .zendure-condense .zc-soc-fg {
        fill: none;
        stroke: #4cd964;
        stroke-width: 3;
        stroke-linecap: round;
    }

    .zendure-condense.zc-animated .zc-soc-fg {
        transition: stroke-dasharray 0.6s ease-out;
    }

    .zendure-condense .zc-soc-value {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
    }

    .zendure-condense .zc-flux {
        list-style: none;
        margin: 0;
        padding: 0;
        /* flex-grow assure que la liste occupe toute la largeur de sa ligne
           une fois repassée sous l'anneau (zc-body en wrap, tuile étroite),
           sinon justify-content: space-between des <li> n'a aucun espace à
           répartir et le libellé colle à la valeur. */
        flex: 1 1 160px;
    }

    .zendure-condense .zc-flux li {
        display: flex;
        justify-content: space-between;
        padding: 1px 0;
    }

    .zendure-condense .zc-intensite {
        height: 4px;
        background: rgba(127, 127, 127, 0.25);
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
    }

    .zendure-condense .zc-intensite-bar {
        height: 100%;
        transition: width 0.4s ease-out, background 0.4s ease-out;
    }

    .zendure-condense .zc-footer {
        margin-top: 6px;
        text-align: right;
        opacity: 0.85;
    }

    .zendure-condense .zc-offline-badge {
        display: none;
        font-size: 10px;
        font-weight: 600;
        color: #ff3b30;
        border: 1px solid currentColor;
        border-radius: 4px;
        padding: 0 4px;
    }

    /* .zc-offline (posée par ##OFFLINE_CLASS##, cf. toHtmlCondense()) : seul
       signal actuellement dispo (transport_connected) -- fait apparaître le
       badge et estompe le reste de la tuile, plutôt que d'afficher des
       valeurs qui datent potentiellement d'une dernière connexion ancienne
       sans le signaler. */
    .zendure-condense.zc-offline .zc-offline-badge {
        display: inline-block;
    }

    .zendure-condense.zc-offline .zc-body,
    .zendure-condense.zc-offline .zc-intensite-label,
    .zendure-condense.zc-offline .zc-intensite,
    .zendure-condense.zc-offline .zc-footer {
        opacity: 0.45;
    }
</style>
<div class="zendure-condense ##ANIMATIONS_CLASS## ##OFFLINE_CLASS##" data-eqid="##EQ_ID##">
    <div class="zc-header">
        <a class="zc-name" href="##EQ_LINK##">##NAME##</a>
        <span class="zc-offline-badge">Hors ligne</span>
        <span class="zc-mode">##MODE##</span>
    </div>

    <div class="zc-body">
        <div class="zc-soc-wrap">
            <div class="zc-soc-ring" style="--zc-soc:##SOC##">
                <svg viewBox="0 0 36 36">
                    <path class="zc-soc-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path class="zc-soc-fg" stroke-dasharray="##SOC##, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <div class="zc-soc-value">##SOC##%</div>
            </div>
            <span class="zc-soc-label">SOC batterie</span>
        </div>

        <ul class="zc-flux">
            <li><span class="zc-flux-label">☀ Solaire</span><span class="zc-flux-value">##SOLAR_W## W</span></li>
            <li><span class="zc-flux-label">⇅ Réseau</span><span class="zc-flux-value">##GRID_W## W</span></li>
            <li><span class="zc-flux-label">⌂ Maison</span><span class="zc-flux-value">##HOUSE_W## W</span></li>
            <li><span class="zc-flux-label">⇥ Injecté</span><span class="zc-flux-value">##INJECTED_W## W</span></li>
        </ul>
    </div>

    <div class="zc-intensite-label">Intensité : ##INTENSITE_A## A / ##IMAX_A## A max (##INTENSITE_PCT##%)</div>
    <div class="zc-intensite">
        <div class="zc-intensite-bar" style="width:##INTENSITE_PCT##%;background:##INTENSITE_COLOR##"></div>
    </div>

    <div class="zc-footer">
        <span>Gain jour : ##GAIN_JOUR## €</span>
    </div>
</div>
