<!--
(page Design) : jauge d'intensité (arc + aiguille SVG,
valeur + marge) autonome, même habillage/logique que le widget Flux mais
en widget de commande indépendant -- cf. commentaire équivalent dans
cmd.info.string.zf_tempo_pill.html. Cas le plus exigeant des 3 templates de
test : seul celui-ci anime un SVG (aiguille) via JS, comme le widget Flux
complet qui échouait en placement `type=cmd` -- sert donc aussi à vérifier
si le problème initial venait de la complexité globale (losange + animations
de particules) ou d'une limitation générale de ce contexte d'insertion.

Pas de recopie de valeur (même principe que la pastille Tempo) : lecture
live de la commande source d'intensité configurée (#IntensiteId#), marge
recalculée ici (imaxA - intensité), jamais stockée.

IMPORTANT -- ordre des balises : le <div> racine DOIT précéder le <style>
dans ce fichier. core/dom/dom.utils.js::DOMparseHTML() (utilisé par
desktop/js/plan.js pour insérer un widget `type=cmd` sur une page Design)
prend le PREMIER élément avec balise (hors commentaires et <script>) comme
racine du widget et met tout le reste dedans -- si ce premier élément est un
<style>, notre <div> de contenu se retrouve ajouté COMME ENFANT du <style>,
qui ne s'affiche jamais (: widget invisible sur une page
Design alors que cmd::toHtml() produit un HTML valide côté serveur). Sur le
dashboard normal ce bug ne se voit pas (autre chemin de rendu, cf.
jeedom.eqLogic.toHtml), d'où le fait qu'il soit passé inaperçu longtemps.

IMPORTANT #2 -- attributs de la racine (une fois le
widget enfin visible : impossible de le déplacer/redimensionner en mode
édition, alors que d'autres commandes (ex. cmd.info.numeric.line.html natif)
le sont). Comparaison avec le HTML réellement rendu d'une commande native
("Distance de la lune", cmd.info.numeric.line.html) : sa racine porte
`class="cmd cmd-widget ..."` PLUS `data-type`/`data-subtype`/`data-template`/
`data-cmd_id`/`data-cmd_uid`/`data-version`/`data-eqLogic_id`. L'éditeur de
page Design cible précisément `.div_displayObject > .cmd-widget` (cf.
desktop/js/plan.js) pour activer drag/resize/sélection -- sans la classe
`cmd-widget` sur notre propre racine, ce sélecteur ne matchait jamais notre
widget (présent dans le DOM, positionné, mais invisible à l'éditeur). Tous
ces tokens (#uid#, #version#, #eqLogic_id#, en plus de #id# déjà connu) sont
substitués nativement par cmd::toHtml() (core/class/cmd.class.php ~L2066+),
pas des paramètres à nous.

Restyle « arc et chiffre » (11/11/2026, page Design de la tablette) : charte
des bulles DesignTouch (fond sombre, bord clair, rayon 12 px), un arc qui se
remplit et change de couleur (vert, orange à partir de 70 % de l'intensité
maximale, rouge à partir de 90 % -- mêmes défauts que seuil_intensite_ambre /
seuil_intensite_rouge et que les zones de l'ancien arc), le chiffre en grand
et « sur N A ». Plus d'aiguille, de marge ni de libellé. Taille fixée ici
(96 x 82, hauteur réduite le 11/11 : le rectangle de 106 était jugé trop haut) : sur une page Design le cœur n'applique ni largeur ni hauteur à
un élément de type cmd. Pas de `gap` (vieux WebView de la tablette), JS ES5.
-->
<div class="cmd cmd-widget zf-mini-gauge" data-type="info" data-subtype="numeric" data-template="zf_gauge" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#" id="zf-gauge-#id#">
<style>
.zf-mini-gauge {
    box-sizing: border-box; width: 96px; height: 82px; padding: 0; margin: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(17, 24, 39, 0.9); border: 1.5px solid rgba(255, 255, 255, 0.22); border-radius: 12px;
    color: #F9FAFB; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1; white-space: nowrap; overflow: hidden;
}
.zf-mini-gauge.zf-gauge-rouge { border-color: #EF4444; }
.zf-mini-gauge svg { display: block; width: 84px; height: 48px; flex: 0 0 auto; }
.zf-mini-gauge-value { margin-top: -22px; font-size: 22px; font-weight: 700; color: #F9FAFB; }
.zf-mini-gauge-value .zf-mini-gauge-unit { font-size: 13px; font-weight: 600; opacity: 0.75; margin-left: 2px; }
.zf-mini-gauge-label { margin-top: 4px; font-size: 11px; color: #9CA3AF; }
</style>
    <svg viewBox="0 0 84 48" aria-hidden="true">
        <path d="M8,44 A34,34 0 0 1 76,44" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="7" stroke-linecap="round" />
        <path id="zf-arc-#id#" d="M8,44 A34,34 0 0 1 76,44" fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round" stroke-dasharray="106.81" stroke-dashoffset="106.81" />
    </svg>
    <div class="zf-mini-gauge-value"><span id="zf-gauge-a-#id#">–</span><span class="zf-mini-gauge-unit">A</span></div>
    <div class="zf-mini-gauge-label" id="zf-gauge-max-#id#"></div>
</div>
<script>
(function () {
    var id = '#id#';
    var intensiteId = #IntensiteId#;
    var imaxA = #ImaxA#;
    var ARC = 106.81; // longueur du demi-cercle de rayon 34
    var root = document.getElementById('zf-gauge-' + id);
    var arc = document.getElementById('zf-arc-' + id);
    var aEl = document.getElementById('zf-gauge-a-' + id);
    var maxEl = document.getElementById('zf-gauge-max-' + id);

    function fr(n) {
        return String(Math.round(n * 10) / 10).replace('.', ',');
    }

    if (maxEl) { maxEl.textContent = imaxA > 0 ? 'sur ' + fr(imaxA) + ' A' : ''; }

    function apply(value) {
        var intensite = parseFloat(value);
        var connu = !isNaN(intensite);
        if (!connu) { intensite = 0; }
        var pct = imaxA > 0 ? Math.max(0, Math.min(100, (intensite / imaxA) * 100)) : 0;
        var rouge = pct >= 90;
        var couleur = rouge ? '#EF4444' : (pct >= 70 ? '#F97316' : '#22C55E');
        if (arc) {
            arc.setAttribute('stroke', couleur);
            // Un trait minimal reste visible dès qu'il y a du courant.
            var plein = (connu && intensite > 0) ? Math.max(1.5, ARC * pct / 100) : 0;
            arc.setAttribute('stroke-dashoffset', (ARC - plein).toFixed(2));
            arc.style.visibility = plein > 0 ? 'visible' : 'hidden';
        }
        // À partir de 10 A, valeur entière : une décimale toucherait les extrémités de l'arc.
        if (aEl) { aEl.textContent = connu ? (Math.abs(intensite) >= 10 ? String(Math.round(intensite)) : fr(intensite)) : '–'; }
        if (root) {
            var cls = root.className.replace(/\s*zf-gauge-rouge/g, '');
            root.className = rouge ? cls + ' zf-gauge-rouge' : cls;
            var titre = 'Intensité réseau : ' + (connu ? fr(intensite) + ' A' : 'inconnue');
            if (imaxA > 0 && connu) { titre += ' sur ' + fr(imaxA) + ' A (marge ' + fr(imaxA - intensite) + ' A)'; }
            root.setAttribute('title', titre);
        }
    }

    if (intensiteId) {
        jeedom.cmd.execute({ id: intensiteId, cache: 0, notify: false, success: apply });
        jeedom.cmd.addUpdateFunction(String(intensiteId), function (_options) { apply(_options.value); });
    }
})();
</script>
